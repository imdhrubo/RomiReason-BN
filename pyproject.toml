[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "romireason-bn"
version = "0.1.0"
description = "Paired evaluation of reasoning robustness in Romanized Bengali"
requires-python = ">=3.11"
dependencies = [
  "aksharamukha==2.3",
  "datasets>=3.0,<4",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pyarrow>=20,<26",
  "sentence-transformers>=5.0,<6",
]

[project.scripts]
romireason = "romireason_bn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
